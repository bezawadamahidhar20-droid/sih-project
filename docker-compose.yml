# MediScan AI — full stack deployment
#
#   docker compose up --build
#
# Services:
#   db       PostgreSQL 16 (encrypted at rest via disk encryption / cloud)
#   backend  FastAPI inference service (AES-256 at-rest, JWT + RBAC)
#   frontend React SPA served by nginx, proxying /api to the backend
#
# Secrets MUST be provided in a root .env file (see .env.example). The
# `:?` syntax below makes `docker compose up` fail fast if any of the three
# app secrets is missing — a misconfigured stack must never start with
# forgeable JWTs or a decryptable data key.
#
# ⚠️  DEMO ACCOUNTS: SEED_DEMO_USERS defaults to FALSE. For the SIH demo,
#     explicitly opt in with `SEED_DEMO_USERS=true docker compose up` — this
#     seeds well-known credentials (doctor / radiologist / staff, password
#     DemoPass123!, printed in the README). Any public deployment must keep
#     SEED_DEMO_USERS unset/false AND provide real JWT_SECRET_KEY /
#     ENCRYPTION_KEY / ENCRYPTION_SALT values.
#
# TLS: terminate HTTPS at a reverse proxy / load balancer in front of this
# stack (e.g. nginx, Caddy, ALB) — never expose the backend port directly.

name: mediscan

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediscan}
      # Required, never defaulted: the old `:-mediscan` default silently ran
      # production against a well-known credential. The backend ALSO refuses
      # known-default passwords (mediscan/postgres/password/empty) when
      # ENVIRONMENT=production, so `docker compose up` fails fast either way.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong value in .env (never the default 'mediscan')}
      POSTGRES_DB: ${POSTGRES_DB:-mediscan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediscan} -d ${POSTGRES_DB:-mediscan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [mediscan]
    # No host port: the database is only reachable inside the stack.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No host port mapping: the API is reachable ONLY through the nginx
    # proxy on the frontend container (Internet -> HTTPS proxy -> frontend
    # -> backend). Exposing /docs or the raw API on a host port would bypass
    # the proxy and widen the attack surface for no benefit.
    expose:
      - "8000"
    environment:
      APP_NAME: MediScan AI
      DEBUG: "false"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mediscan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-mediscan}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY (>=32 chars) in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (>=32 chars) in .env}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?set ENCRYPTION_SALT (>=16 chars) in .env}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      MODEL_PATH: /app/models/model.pth
      MODEL_ARCHITECTURE: ${MODEL_ARCHITECTURE:-resnet50}
      MODEL_NUM_CLASSES: ${MODEL_NUM_CLASSES:-2}
      MODEL_INPUT_SIZE: ${MODEL_INPUT_SIZE:-224}
      MODEL_CLASSES: ${MODEL_CLASSES:-["Normal","Pneumonia"]}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUDIT_LOG_PATH: /app/logs/audit.log
      # Behind nginx: trust X-Forwarded-For for login-lockout / rate-limit keys.
      TRUST_PROXY_HEADERS: "true"
      # Required in production: the CORS allowlist doubles as the CSRF
      # Origin allowlist, and the backend refuses to boot with non-HTTPS /
      # localhost origins while ENVIRONMENT=production. Set the real HTTPS
      # frontend origin.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to your HTTPS frontend origin in .env (e.g. ["https://mediscan.example.com"])}
      # A trained model is REQUIRED in production: with the file missing and
      # heuristic fallback disabled, prediction requests fail loudly (HTTP
      # 500) instead of serving guessed diagnoses. Only flip this for an
      # explicit dev/demo environment.
      ALLOW_HEURISTIC_FALLBACK: ${ALLOW_HEURISTIC_FALLBACK:-false}
      # Shared security state (rate limiting / login lockout). Default false
      # for the single-worker demo; set USE_REDIS=true before scaling to
      # multiple workers (WORKERS>1 is refused otherwise).
      USE_REDIS: ${USE_REDIS:-false}
      # Password comes from the same REDIS_PASSWORD the redis service
      # requires. Use an alphanumeric password (no URL-special chars).
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      LOW_CONFIDENCE_THRESHOLD: ${LOW_CONFIDENCE_THRESHOLD:-0.7}
      HIGH_RISK_THRESHOLD: ${HIGH_RISK_THRESHOLD:-0.9}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
      # Drop a trained model.pth into ./backend/models to enable CNN + Grad-CAM
      - ./backend/models:/app/models:ro
    networks: [mediscan]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis AUTH (requirepass) is enabled by default: the backend connects
    # with the password embedded in REDIS_URL (redis-py parses it), and the
    # healthcheck authenticates the same way. No host port: Redis is only
    # reachable inside the stack. Used for shared rate limiting / login
    # lockout when USE_REDIS=true (needed to scale beyond one worker); with
    # USE_REDIS=false (the default) it stays idle but is still protected.
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD to a strong value in .env}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [mediscan]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [mediscan]

volumes:
  pgdata:
  redisdata:
  uploads:
  logs:

networks:
  mediscan:
