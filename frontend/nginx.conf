# MediScan AI — nginx reverse proxy for the SPA (production container).
# Serves the static React build and forwards API calls to the backend service.
#
# Security headers live HERE (not only in deploy/nginx-production.conf.example)
# so the compose frontend container is secure by default: the example file is
# an optional edge-proxy template, but a deployment that only runs `docker
# compose up` must still ship the documented CSP / HSTS / clickjacking
# protections. TLS itself is terminated at the edge proxy in front of this
# container; the HSTS header set here travels back to the browser through
# that HTTPS hop and is honored there.

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Security headers (mirrors deploy/nginx-production.conf.example so the
    # container behaves identically whether or not an edge proxy is present).
    # HSTS is safe to send even on the plain-HTTP listener: browsers only
    # honor it on HTTPS responses, and the edge proxy passes it through.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # The SPA is built with Vite (hashed external assets, no inline scripts),
    # fonts are self-hosted, and Grad-CAM images render via blob: URLs — this
    # CSP is verified by the browser E2E and allows none of it to leave the
    # origin.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API proxy -> FastAPI backend (docker-compose service name)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow 50MB scan uploads plus multipart overhead
        client_max_body_size 55m;

        # Inference can take a while on CPU
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA routing: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively (vite emits content-hashed filenames)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
