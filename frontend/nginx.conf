# MediScan AI — nginx reverse proxy for the SPA.
# Serves the static React build and forwards API calls to the backend service.

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Basic security headers (terminate TLS at the edge proxy)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API proxy -> FastAPI backend (docker-compose service name)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow 50MB scan uploads plus multipart overhead
        client_max_body_size 55m;

        # Inference can take a while on CPU
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA routing: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively (vite emits content-hashed filenames)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
